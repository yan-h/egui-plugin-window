# egui and egui-wgpu 0.37 declare Rust 1.95, and plugin-own-window's atomic
# `update` is stable only after 1.92; a project pinning these crates needs a
# toolchain that has both. A project builds them with its own toolchain,
# whatever this says.
[toolchain]
channel = "1.99.1"
components = ["clippy", "rustfmt"]
