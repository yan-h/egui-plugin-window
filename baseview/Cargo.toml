# Cargo's normalized form of the published manifest, edited in place since
# the crate was pruned to what compiles on macOS (PATCHES.md).

[package]
edition = "2021"
rust-version = "1.80"
name = "baseview"
version = "0.1.4"
authors = [
    "William Light <git@wrl.lhiaudio.com>",
    "Charles Saracco <crsaracco@gmail.com>",
    "Mirko Covizzi <mrkcvzz@gmail.com>",
    "Micah Johnston <micah@glowcoil.com>",
    "Billy Messenger <billydm@protonmail.com>",
    "Anton Lazarev <https://antonok.com>",
    "Joakim Frostegård <joakim.frostegard@gmail.com>",
    "Robbert van der Helm <mail@robbertvanderhelm.nl>",
    "Adrien Prokopowicz <prokopylmc@gmail.com>",
]
build = false
exclude = [".github"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Low-level windowing system geared towards making audio plugin UIs."
readme = "README.md"
keywords = [
    "windowing",
    "audio",
    "plugin",
]
categories = ["gui"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/RustAudio/baseview"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
# Native tests only: lets a test set what a window's occlusion state reads as
# (`baseview::testing`). No plug-in enables it.
testing = []

[lib]
name = "baseview"
path = "src/lib.rs"

[[test]]
name = "host_keys"
path = "tests/host_keys.rs"
harness = false

[[test]]
name = "press_location"
path = "tests/press_location.rs"
harness = false

[[test]]
name = "reentrant_events"
path = "tests/reentrant_events.rs"
harness = false

[[test]]
name = "unseen_frames"
path = "tests/unseen_frames.rs"
harness = false

[[test]]
name = "unseen_notice"
path = "tests/unseen_notice.rs"
harness = false
required-features = ["testing"]

[dependencies.keyboard-types]
version = "0.6.1"
default-features = false

[dependencies.raw-window-handle]
version = "0.5"

[target.'cfg(target_os="macos")'.dependencies.block2]
version = "0.6.2"

[target.'cfg(target_os="macos")'.dependencies.objc2]
version = "0.6.4"

[target.'cfg(target_os="macos")'.dependencies.objc2-app-kit]
version = "0.3.2"
features = [
    "NSApplication",
    "NSCursor",
    "NSDragging",
    "NSEvent",
    "NSGraphics",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSTrackingArea",
    "NSView",
    "NSWindow",
    "objc2-core-foundation",
    "objc2-quartz-core",
]
default-features = false

[target.'cfg(target_os="macos")'.dependencies.objc2-core-foundation]
version = "0.3.2"
features = [
    "std",
    "CFString",
    "CFUUID",
    "objc2",
]
default-features = false

[target.'cfg(target_os="macos")'.dependencies.objc2-foundation]
version = "0.3.2"
features = [
    "std",
    "NSEnumerator",
    "block2",
    "NSOperation",
    "NSObjCRuntime",
    "NSRunLoop",
]
default-features = false

[target.'cfg(target_os="macos")'.dependencies.objc2-quartz-core]
version = "0.3.2"
features = [
    "std",
    "CABase",
    "CADisplayLink",
    "objc2-core-foundation",
]
default-features = false

[lints.clippy]
missing-safety-doc = "allow"
