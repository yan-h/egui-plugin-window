# Cargo's normalized form of the published manifest, edited in place since
# the crate was pruned to what compiles on macOS (PATCHES.md).

[package]
edition = "2024"
name = "egui-baseview"
version = "0.3.0"
authors = ["Billy Messenger <billydm@noreply.codeberg.org>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A baseview backend for egui"
readme = "README.md"
keywords = [
    "nice-plug",
    "plugin",
    "clap",
    "vst",
    "vst3",
]
categories = ["gui"]
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/RustAudio/egui-baseview"

[features]
default = ["tracing"]
keyboard_focus_workaround = []
# A per-frame timing log for diagnosing missed refreshes (src/frame_log.rs).
# macOS only; it does nothing elsewhere.
frame-log = [
    "wgpu",
    "dep:block2",
    "dep:objc2-metal",
    "objc2-quartz-core/CABase",
    "objc2-quartz-core/objc2-core-foundation",
]
nice-log = ["dep:nice-plug-core"]
tracing = ["dep:tracing"]
wgpu = [
    "dep:egui-wgpu",
    "dep:raw-window-handle-06",
    "dep:pollster",
    "dep:wgpu",
]

[lib]
name = "egui_baseview"
path = "src/lib.rs"

# By path, so a project's pin of this crate carries the baseview from the
# same commit: a project naming baseview itself must pin the same commit, or
# it builds two baseviews whose types do not meet.
[dependencies.baseview]
version = "0.1.4"
path = "../baseview"

[dependencies.copypasta]
version = "0.10"
default-features = false

[dependencies.egui]
version = "0.37.0"
features = ["bytemuck"]
default-features = false

[dependencies.egui-wgpu]
version = "0.37.0"
optional = true

[dependencies.keyboard-types]
version = "0.6"
default-features = false

[dependencies.nice-plug-core]
version = "0.1.3"
optional = true

[dependencies.open]
version = "5.3.3"

[dependencies.pollster]
version = "1.0"
optional = true

[dependencies.raw-window-handle]
version = "0.5"

[dependencies.raw-window-handle-06]
version = "0.6"
optional = true
package = "raw-window-handle"

[dependencies.tracing]
version = "0.1"
optional = true

[dependencies.wgpu]
version = "30"
optional = true

# The same objc2 generation wgpu-hal 30 builds against, so the
# `Retained<CAMetalLayer>` pulled out of `Surface::as_hal` in the wgpu
# renderer is the same type on both sides. Only used on macOS with the
# `wgpu` feature (src/renderer/wgpu/renderer.rs, `layer_present`).
[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6"

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3"
features = [
    "NSDictionary",
    "NSString",
    "NSNull",
    "NSObject",
]

[target.'cfg(target_os = "macos")'.dependencies.objc2-quartz-core]
version = "0.3"
features = [
    "CALayer",
    "CAMetalLayer",
]

# The `frame-log` feature's Metal completion and presented handlers.
[target.'cfg(target_os = "macos")'.dependencies.objc2-metal]
version = "0.3"
optional = true
default-features = false
features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "MTLCommandBuffer",
    "MTLDrawable",
]

[target.'cfg(target_os = "macos")'.dependencies.block2]
version = "0.6"
optional = true

[dev-dependencies.egui]
version = "0.37.0"
features = ["default_fonts"]
